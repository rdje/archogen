# Workspace root. Crates follow the responsibility names in ROADMAP.md §4.2 and are created
# when a real consumer justifies the split — not as empty shells up front.
[workspace]
resolver = "2"
members = ["crates/*", "xtask"]
# LinkedSpec is vendored for development-time evaluation only (docs/feedback/linkedspec/); no crate
# depends on it. Its packages must still stay OUT of this workspace: cargo discovers a workspace by
# walking up from each manifest, so without this exclusion a vendored manifest binds to this root and
# then refuses to resolve — the collision reported upstream as LS-001, and the exclusion its
# integration guide requires of a workspace consumer before any metadata or build command.
# `target` for the same walk from the other side: a Cargo fixture built under `target/` — a test's scratch
# or a gate's — must not bind to this root either, or a fixture that models "no enclosing workspace"
# silently has one (measured by leaf `PROGRAM.29`: LS-001's self-test, moved onto this volume, lost an arm).
exclude = ["vendor/linkedspec", "target"]

[workspace.package]
edition = "2021"
license = "MIT OR Apache-2.0"

# Shared lints so every crate inherits the same strictness (opt in per crate with
# `[lints] workspace = true`). clippy runs at deny-warnings in `make check` / CI.
[workspace.lints.clippy]
all = "warn"

# No object file is kept for its debug information (leaf `PROGRAM.58`). Cargo's default for
# `split-debuginfo` on macOS is `unpacked`: rustc keeps every object file a build compiles so that a
# debugger can read its debug information there, each later build names its objects afresh, and nothing
# ever deletes the old ones. Measured, each relink of the test suite left about 6 100 objects in
# `target/debug/deps`, and six days had left 1 454 953. `off` is rustc's own default on Linux, where the
# debug information is linked into the executable, so nothing changes there. On macOS, backtraces keep
# their function names and lose file and line; the panic location is still printed. To get line numbers
# back for one debugging session, see "a backtrace with file and line" in `TOOLBOX.md`. rustc does not
# support `off` on Windows MSVC, so the leaf that takes up Windows hosts (ROADMAP.md §3.1) revisits this
# line; `packed` is no way out, since the `wasm32` and bare-metal targets support `off` alone. The test
# profile inherits this one.
[profile.dev]
split-debuginfo = "off"
