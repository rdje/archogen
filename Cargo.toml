# Workspace root. Crates follow the responsibility names in ROADMAP.md §4.2 and are created
# when a real consumer justifies the split — not as empty shells up front.
[workspace]
resolver = "2"
members = ["crates/*", "xtask"]
# LinkedSpec is vendored for development-time evaluation only (docs/feedback/linkedspec/); no crate
# depends on it. Its packages must still stay OUT of this workspace: cargo discovers a workspace by
# walking up from each manifest, so without this exclusion a vendored manifest binds to this root and
# then refuses to resolve — the collision reported upstream as LS-001, and the exclusion its
# integration guide requires of a workspace consumer before any metadata or build command.
exclude = ["vendor/linkedspec"]

[workspace.package]
edition = "2021"
license = "MIT OR Apache-2.0"

# Shared lints so every crate inherits the same strictness (opt in per crate with
# `[lints] workspace = true`). clippy runs at deny-warnings in `make check` / CI.
[workspace.lints.clippy]
all = "warn"
