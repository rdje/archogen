# Workspace root. Crates follow the responsibility names in ROADMAP.md §4.2 and are created
# when a real consumer justifies the split — not as empty shells up front.
[workspace]
resolver = "2"
members = ["crates/*", "xtask"]

[workspace.package]
edition = "2021"
license = "MIT OR Apache-2.0"

# Shared lints so every crate inherits the same strictness (opt in per crate with
# `[lints] workspace = true`). clippy runs at deny-warnings in `make check` / CI.
[workspace.lints.clippy]
all = "warn"
