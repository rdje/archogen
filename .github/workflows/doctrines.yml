name: doctrines
# E4 enforcement: the SAME doctrine enforcer the pre-commit hook runs, so a locally
# --no-verify'd commit still fails here.
on:
  push:
  pull_request:

# Read-only, and no checkout keeps the token (WORKFLOW-TOKENS, leaf M2.7.6.1): a pull request's branch runs here too.
permissions:
  contents: read

jobs:
  enforce:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0, what v4 resolved to on 2026-09-30
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Make spine scripts executable
        run: chmod +x scripts/*.sh knowledge-map/scripts/*.sh .githooks/pre-commit .githooks/commit-msg || true
      - name: Run the doctrine enforcer
        run: scripts/check_doctrines.sh
      # Every gate's own RED arms (PROGRAM.28): the enforcer proves the tree is clean, this proves each gate
      # can still fail. Discovered by census, so a gate armed tomorrow runs here the day it is armed.
      - name: Run every gate's self-test
        run: scripts/run_self_tests.sh
