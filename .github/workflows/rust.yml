name: rust
# The SAME object the developer runs locally. Before this, CI listed three steps and the
# Makefile listed three steps, and keeping them identical was somebody's job; now there is one
# declaration of the focused tier (xtask/src/main.rs) and both call it.
on:
  push:
  pull_request:

jobs:
  focused:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      # ROADMAP.md §14.3 focused tier: format, lints, and the whole contract suite.
      - name: Focused tier
        run: cargo xtask verify --tier focused

  # ROADMAP.md §14.3 integration tier, "before merge" (leaf PROGRAM.10.4). What its verdict does to this job is
  # docs/decisions/decision_incomplete-blocking-policy.md, carried out by scripts/ci_integration.sh: `passed`
  # passes, `failed` fails, `incomplete` passes with a warning per owned gap and a job summary. The tier runs
  # --provisioned, so a tool the steps below fail to install is a failure, never an "unavailable".
  integration:
    # A named image rather than ubuntu-latest: the package names below are this release's.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          # the doctrine step reads history, as the doctrines workflow does
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: riscv64imac-unknown-none-elf
      # What building the pinned QEMU needs from the image. QEMU itself is built at its pin, below: the image's
      # own package is another release, and target_emulator.sh --check refuses a release other than the pin.
      - name: Build dependencies for the pinned QEMU
        run: >-
          sudo apt-get update &&
          sudo apt-get install -y --no-install-recommends
          ninja-build pkg-config libglib2.0-dev libpixman-1-dev flex bison python3-venv
      # The pinned tools, kept between runs. The key moves with any file that pins them or checks their digests.
      - uses: actions/cache@v4
        with:
          path: target/ci/tools
          key: ci-tools-${{ runner.os }}-${{ hashFiles('.github/ci-tools.env', 'targets/riscv-virt-up.env', 'scripts/ci_provision.sh') }}
      - name: Provision mdbook and QEMU at their pins
        run: bash scripts/ci_provision.sh
      - name: Integration tier
        run: bash scripts/ci_integration.sh
