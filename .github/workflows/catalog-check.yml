name: catalog-check
# The catalog check (leaf M2.7.6.3). Premise 3 of docs/specs/catalog/decision_catalog-records.md: no code or file a
# pull request controls runs in the check, lies on the path of what it builds or runs, or reaches its credentials,
# and nothing but the check posts its verdict. What this file does toward that:
#   - the judged commit — the hosting's merge of the pull request into its base, or the merge queue's — is written
#     to judged/, and nothing ever runs from there;
#   - the base is the judged commit's first parent, checked out in base/ from a local clone of judged/, so it needs
#     no credentials, and everything run from base/ — this harness, the toolchain file rustup installs from, the
#     checker's sources — is the base's;
#   - scripts/catalog_check.sh (M2.7.6.2) builds the checker from the base's blobs under an allowlisted environment
#     and runs it on the judged commit's blobs; the token is read-only and no checkout keeps it (WORKFLOW-TOKENS).
# What only the hosting can do, and findings §11 asks of the director: require this workflow by a ruleset that pins
# it outside the pull request's tree, so a pull request's edited copy of this file, or an added job named
# catalog-check, never satisfies the requirement; ephemeral runners and no cache; a read-only default token.
# The checker's entry, `xtask catalog-check --base <dir> --judged <dir> --base-commit <sha> --judged-commit <sha>`,
# exit 0 for a pass, is M2.7.4.2's: the judged commit's catalog loaded and replayed against the base's.
on:
  pull_request:
  merge_group:

# Read-only, and no checkout keeps the token (WORKFLOW-TOKENS, leaf M2.7.6.1).
permissions:
  contents: read

jobs:
  catalog-check:
    runs-on: ubuntu-24.04
    steps:
      # The commit the hosting made for this run: github.sha is the merge branch's last merge commit for a
      # pull_request event and the merge group's for merge_group — never the event payload's merge_commit_sha,
      # which can be null or stale (review round 1, V4). A SHA, never text a pull request wrote.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0, what v4 resolved to on 2026-09-30
        with:
          ref: ${{ github.sha }}
          path: judged
          fetch-depth: 2
          persist-credentials: false
      - name: Check out the base beside the judged commit
        run: |
          git clone --quiet --no-checkout judged base
          git -C base checkout --quiet --detach "$(git -C judged rev-parse HEAD^1)"
      # From base/, so rustup reads the base's rust-toolchain.toml and no judged file.
      - name: The pinned Rust toolchain
        working-directory: base
        run: rustup toolchain install --no-self-update
      - name: The catalog check
        working-directory: base
        run: >-
          bash scripts/catalog_check.sh --base HEAD --judged "$(git -C ../judged rev-parse HEAD)"
          --checker xtask:xtask -- catalog-check --base '{base}' --judged '{judged}'
          --base-commit '{base-commit}' --judged-commit '{judged-commit}'
