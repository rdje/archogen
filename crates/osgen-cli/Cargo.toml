# The `osgen` command-line entry point. Deliberately dependency-free: see
# docs/decisions/decision_zero-dependency-engine-core.md.
[package]
name = "osgen-cli"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Command-line entry point for the archogen eADL-to-OS generation toolchain"

[lib]
name = "osgen_cli"
path = "src/lib.rs"

[[bin]]
name = "osgen"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
eadl-front = { path = "../eadl-front" }
eadl-model = { path = "../eadl-model" }
