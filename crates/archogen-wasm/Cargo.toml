# The WebAssembly binding over the engine API (ROADMAP.md §10.4, leaf `API.5`), as
# docs/decisions/decision_wasm-binding.md decides it: the `cdylib` is the artifact a page loads, and the `rlib`
# lets the host's tests call the same functions without a wasm toolchain.
[package]
name = "archogen-wasm"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "The WebAssembly binding of the archogen engine API: three exports, a framed request, a JSON response"

[lints]
workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
archogen-api = { path = "../archogen-api" }
eadl-front = { path = "../eadl-front" }
