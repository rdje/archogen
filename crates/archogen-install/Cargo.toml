# The install manifest, archogen-install/1 (leaf M3.5.1.3): what an install placed, and from which build.
#
# A separate crate ON PURPOSE, and no role's: `cargo xtask install` writes the manifest and the front reads it, and
# neither should compile the other's code — in archogen-outcome every checker would compile a format it never reads,
# in archogen-cli the runner would compile the generator's role packages. It does no I/O.
[package]
name = "archogen-install"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "The archogen-install/1 manifest of the archogen toolchain: what an install placed, from which build"

[lints]
workspace = true

[dependencies]
archogen-digest = { path = "../archogen-digest" }
archogen-json = { path = "../archogen-json" }
