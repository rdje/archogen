# The `archogen` command-line entry point. Deliberately dependency-free: see
# docs/decisions/decision_zero-dependency-engine-core.md.
[package]
name = "archogen-cli"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Command-line entry point for the archogen eADL-to-OS generation toolchain"

[lib]
name = "archogen_cli"
path = "src/lib.rs"

[[bin]]
name = "archogen"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
archogen-api = { path = "../archogen-api" }
# The launcher's: the sibling's sha256 and the install manifest it is checked against (leaf `M3.5.1.4.1`).
archogen-digest = { path = "../archogen-digest" }
archogen-install = { path = "../archogen-install" }
# The checker's result record, which the front reads before it builds on a plan (leaf `M3.5.1.4.3`).
archogen-outcome = { path = "../archogen-outcome" }
# The MCP server's framing, which each role's server shares (leaf `M3.5.1.6.1`).
archogen-transport = { path = "../archogen-transport" }
archogen-json = { path = "../archogen-json" }
archogen-s0 = { path = "../archogen-s0" }
# The response's encoding, so the MCP server answers the bytes the wasm binding does (leaf `API.6.4`).
archogen-wasm = { path = "../archogen-wasm" }
eadl-front = { path = "../eadl-front" }
eadl-model = { path = "../eadl-model" }
