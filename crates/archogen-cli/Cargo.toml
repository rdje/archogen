# The `archogen` command-line entry point. Deliberately dependency-free: see
# docs/decisions/decision_zero-dependency-engine-core.md.
[package]
name = "archogen-cli"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Command-line entry point for the archogen eADL-to-OS generation toolchain"

[lib]
name = "archogen_cli"
path = "src/lib.rs"

[[bin]]
name = "archogen"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
archogen-api = { path = "../archogen-api" }
archogen-s0 = { path = "../archogen-s0" }
eadl-front = { path = "../eadl-front" }
eadl-model = { path = "../eadl-model" }
