# JSON: an RFC 8259 reader that refuses what the grammar does not admit and bounds what it reads, and a writer with
# one way to write each value (leaf API.6.3; its own package since M3.5.1.7). No role's: the MCP server reads its
# messages with it, and the reader of a checker's result record reads that record with it.
[package]
name = "archogen-json"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "A bounded, strict RFC 8259 reader and a one-way writer for the archogen toolchain"

[lints]
workspace = true

