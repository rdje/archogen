# The substitutability relation (ROADMAP.md §4.2 `eadl-resolve`, §5.2): the production relation (M3.1.2), tested
# against the relation's executable model, transcribed from docs/decisions/decision_substitutability-relation.md (leaf
# M3.1.1.1) and the configuration checker's since leaf M3.5.3 moved it into archogen-plan-check, a development
# dependency here. Dependency-free: docs/decisions/decision_zero-dependency-engine-core.md.
[package]
name = "eadl-resolve"
version = "0.1.0"
edition.workspace = true
