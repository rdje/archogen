# Shared runtime state transitions and policy implementations (ROADMAP.md §4.2 `rt-core`, §8).
#
# `no_std` outside its own tests: §3.1 fixes the runtime as "Rust no_std core with narrow
# architecture and MMIO boundaries", and a core that only compiles with `std` is one nobody can
# put on a target.
