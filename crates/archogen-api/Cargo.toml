# The engine API: ROADMAP.md §10.4, docs/decisions/decision_engine-api.md. Every consumer — the CLI, the wasm
# binding, the MCP server — judges a description through this crate and no other way. It does no I/O, and it
# depends only on its engine siblings: see docs/decisions/decision_zero-dependency-engine-core.md.
