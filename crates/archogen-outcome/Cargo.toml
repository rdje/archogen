# The outcome vocabulary and the result record (leaf M3.5.1.1): how every invocation of every role ends, and the
# record a checker writes for the front and the build to read.
#
# A separate crate ON PURPOSE, and no role's: the generator and both checkers compile it, so the trust inventory sees
# the vocabulary, the record's writer and its reader as the one shared item they are (decision_trust-inventory.md
# §4), never as a module of a role package. It does no I/O, and it compiles nothing of the language's reader: what a
# verdict is in this vocabulary stays with the engine API.
[package]
name = "archogen-outcome"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "The status vocabulary and the archogen-result/1 record of the archogen toolchain"

[lints]
workspace = true

[dependencies]
archogen-digest = { path = "../archogen-digest" }
archogen-json = { path = "../archogen-json" }
